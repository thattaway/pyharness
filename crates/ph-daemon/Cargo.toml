[package]
name = "ph-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Session supervisor, worker processes, and wire protocol."

[dependencies]
ph-types = { path = "../ph-types" }
ph-core = { path = "../ph-core" }
ph-agent = { path = "../ph-agent" }
ph-ai = { path = "../ph-ai" }
ph-telemetry = { path = "../ph-telemetry" }
anyhow = { workspace = true }
futures = { workspace = true }
globset = "0.4"
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
# The orphan-journal e2e signals and probes process groups directly.
nix = { version = "0.29", features = ["signal", "process"] }
socket2 = "0.6"
# The supervisor property suite draws sibling rosters for the live
# rename ladder; the plain std features are enough (no fork/timeout).
proptest = { workspace = true }
# Test-only: `ModelCatalog::with_urls` + the compiled offline Prime
# Inference entries build the loopback catalog the session-model restore
# tests script (the ph-core tests/common pattern, in-crate), and the
# catalog-repo child-resolution regression writes the layer-A disk cache
# in the ph-models snapshot shape; the crate's runtime surface goes
# through ph-core.
ph-models = { path = "../ph-models" }
url = "2"
# The MCP catalog e2e seeds the fetch lane's snapshot envelope: the real
# catalog url/scope constants keep the seeded cache byte-honest.
# `test-util` (tokio time pause) is test-only: the mutation-drain latch test
# drives real timeouts through the paused clock.
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "ph-daemon"
path = "src/main.rs"

[lints]
workspace = true
